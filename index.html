<!DOCTYPE html>
<html lang="en" data-theme="dark" data-hl="flow" data-back="corners">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="themeColor" content="#131314">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Combio">
<title>Cambio Card Game</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='3' y='2' width='18' height='20' rx='3' fill='%231a73e8'/><path d='M12 7c-1.5 2-3 3-3 4.5 0 1.2 1 2 2 2 .5 0 1-.2 1-.5v2h-2v1h4v-1h-2v-2c0 .3.5.5 1 .5 1 0 2-.8 2-2 0-1.5-1.5-2.5-3-4.5z' fill='white'/></svg>">
<style>
/* ==========================================================================
   Material Design 3 (Expressive) tokens - Gemini-flavoured baseline scheme
   ========================================================================== */
:root {
  --font: "Google Sans", "Google Sans Text", Roboto, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --header-height: 64px;
  --safe-top: env(safe-area-inset-top, 0px);
  --header-total: calc(var(--header-height) + var(--safe-top));
  --table-left: max(16px, env(safe-area-inset-left, 0px));
  --table-right: max(16px, env(safe-area-inset-right, 0px));
  --table-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  /* All cards share ONE size everywhere, so a move is a pure translation (no scaling). */
  --ch: clamp(60px, calc((100vh - 280px) / 5), 124px);
  --cw: calc(var(--ch) * 5 / 7);
  --rc: calc(var(--cw) * 0.11);
  --gap: 10px;
  --pile-gap: 28px;
  --move: 560ms;
  --pc0: #d6e3f8; --pc1: #fadbe4; --pc2: #faefc9; --pc3: #d5eee3;   /* macaron, idle */
  --pa0: #9dbdf0; --pa1: #f3a8bd; --pa2: #f4d788; --pa3: #94d6bb;   /* macaron, current turn (still soft) */
  --ease: cubic-bezier(0.3, 0, 0, 1);
  --ease-spring: cubic-bezier(0.34, 1.2, 0.64, 1);
}
html[data-theme="dark"] {
  --bg: #131314;
  --surface: #1e1f20;
  --surface-high: #282a2c;
  --surface-highest: #333537;
  --on-surface: #e3e3e3;
  --on-surface-variant: #c4c7c5;
  --outline: #8e918f;
  --outline-variant: #444746;
  --primary: #a8c7fa;
  --on-primary: #062e6f;
  --primary-container: #0842a0;
  --on-primary-container: #d3e3fd;
  --secondary-container: #004a77;
  --on-secondary-container: #c2e7ff;
  --error-container: #8c1d18;
  --on-error-container: #f9dedc;
  --warn: #fdd663;
  --stage: #17181a;
  --dot-a: rgba(255,255,255,.045);
  --dot-b: rgba(0,0,0,.35);
  --back-a: #5c687e; --back-b: #3b4457; --back-line: rgba(255,255,255,.24);
  --bk-slate-a: #5c687e; --bk-slate-b: #3b4457; --bk-mist-a: #4f6a8f; --bk-mist-b: #364b6b; --bk-sage-a: #5f7367; --bk-sage-b: #44564c;
  --bk-rose-a: #7a5f6a; --bk-rose-b: #574350; --bk-sand-a: #7c7261; --bk-sand-b: #574f43;
  --pc0: #36435a; --pc1: #4a3b45; --pc2: #4a4636; --pc3: #364a42;   /* idle name tags: darker in dark mode */
  --pill-fg: #e7eaf1; --pill-line: rgba(255,255,255,.14); --pill-line-act: rgba(255,255,255,.45);
  --wb0: #2c3a54; --wb1: #523a44; --wb2: #54492c; --wb3: #2c4c3e; --wt: #eef1f7;   /* who-knows badges */
  --chip-bg: rgba(20, 25, 36, .92); --chip-fg: #eef2f8; --chip-r: #ff9e97;        /* memory chips */
  --tt-bg: #e6e9ef; --tt-fg: #1f2430;
  --card-back-edge: rgba(255,255,255,.12);
  --sel-bg: #4a5f86; --sel-fg: #eef3ff;
  --bar-a: #8ab4f8; --bar-b: #c58af9; --bar-c: #f28b82;
  --soft-bg: #2b3340; --soft-fg: #bccce6;
  --soft-danger-bg: #3b2f2f; --soft-danger-fg: #e9c0bb;
  --card-front: linear-gradient(160deg, #eef1f7, #d9dfeb);   /* dark mode: softer, slightly cool paper */
  --ink: #1c2230; --ink-red: #b92d33; --hl-tip: #ffffff;
  --glow-blend: screen;
  --glow-alpha: .62;
  --ra: .5;
  --ga: .5;
}
html[data-theme="light"] {
  --bg: #f8fafd;
  --surface: #f0f4f9;
  --surface-high: #e9eef6;
  --surface-highest: #dde3ea;
  --on-surface: #1f1f1f;
  --on-surface-variant: #444746;
  --outline: #747775;
  --outline-variant: #c4c7c5;
  --primary: #0b57d0;
  --on-primary: #ffffff;
  --primary-container: #d3e3fd;
  --on-primary-container: #041e49;
  --secondary-container: #c2e7ff;
  --on-secondary-container: #001d35;
  --error-container: #f9dedc;
  --on-error-container: #410e0b;
  --warn: #e37400;
  --stage: #dde5f1;
  --dot-a: rgba(255,255,255,.8);
  --dot-b: rgba(31,31,31,.09);
  --back-a: #b4bfd3; --back-b: #8f9cb5; --back-line: rgba(255,255,255,.72);
  --bk-slate-a: #b4bfd3; --bk-slate-b: #8f9cb5; --bk-mist-a: #b3c6e0; --bk-mist-b: #94abd0; --bk-sage-a: #b9c9bd; --bk-sage-b: #97ad9f;
  --bk-rose-a: #d6bcc6; --bk-rose-b: #bb9aa8; --bk-sand-a: #d9ccb4; --bk-sand-b: #bfae8e;
  --pill-fg: #2b2f3a; --pill-line: rgba(255,255,255,.8); --pill-line-act: rgba(255,255,255,.6);
  --wb0: #d6e3f8; --wb1: #fadbe4; --wb2: #faefc9; --wb3: #d5eee3; --wt: #1b1d22;
  --chip-bg: rgba(255, 255, 255, .94); --chip-fg: #1f2937; --chip-r: #d93025;
  --tt-bg: #2f3542; --tt-fg: #f2f4f8;
  --card-back-edge: rgba(255,255,255,.5);
  --sel-bg: #506690; --sel-fg: #ffffff;
  --bar-a: #3f6fd8; --bar-b: #7c4fc4; --bar-c: #d2415a;
  --soft-bg: #dfe6f1; --soft-fg: #2f4d7d;
  --soft-danger-bg: #f1dfdd; --soft-danger-fg: #7a3a35;
  --card-front: #ffffff;
  --ink: #1f1f1f; --ink-red: #d32f2f; --hl-tip: #8fb0f0;
  --glow-blend: multiply;   /* dark uses Screen / Linear Dodge; light uses Multiply so light darkens the table instead of washing out */
  --glow-alpha: .7;
  --ra: .95;
  --ga: .6;
}

* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: var(--font); }
html, body { height: 100%; }
button { touch-action: manipulation; }
#cardLayer .pc { touch-action: none; }                      /* cards are dragged, never scrolled/zoomed */
body {
  background: var(--bg); color: var(--on-surface);
  display: flex; flex-direction: column; overflow: hidden;
  transition: background .3s, color .3s;
}
.icon { width: 24px; height: 24px; fill: currentColor; display: block; }

/* ---------- Top app bar ---------- */
.topbar {
  height: var(--header-total); flex: none; display: flex; justify-content: space-between; align-items: center;
  padding: var(--safe-top) var(--table-right) 0 max(24px, var(--table-left)); position: relative; z-index: 40;
}
.brand { font-size: 22px; font-weight: 500; letter-spacing: .1px; color: var(--on-surface); }
.hudbox { position: absolute; top: 16px; left: 20px; z-index: 30; display: flex; flex-direction: column; align-items: flex-start; gap: 16px; max-width: 300px; }
.round-info { font-size: 13px; font-weight: 700; letter-spacing: .4px; color: var(--on-surface); padding-left: 6px; opacity: .85; }
.status {
  display: flex; align-items: center; min-height: 44px; padding: 10px 22px; border-radius: 22px;
  background: var(--surface-highest); color: var(--on-surface);
  font-size: 15px; font-weight: 600; line-height: 1.35; letter-spacing: .1px;
  box-shadow: inset 0 0 0 1px var(--outline-variant); transition: background .3s, color .3s, box-shadow .3s;
}
.status .dot { display: none; }
.shortcut-hint { padding-inline: 6px; color: var(--on-surface-variant); font-size: 12px; line-height: 1.8; }
.shortcut-hint > div:not([hidden]) + div:not([hidden]) { margin-top: 6px; }
.shortcut-hint kbd {
  display: inline-block; padding: 0 6px; border: 1px solid var(--outline);
  border-bottom-width: 2px; border-radius: 5px; background: var(--surface); color: var(--on-surface); font-weight: 600;
}
.status.me { background: var(--soft-bg); color: var(--soft-fg); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--soft-fg) 35%, transparent), 0 2px 10px rgba(0,0,0,.18); }
.stage:not(.ingame) .name-pill, .stage:not(.ingame) .hudbox { visibility: hidden; }
.tools { display: flex; justify-content: flex-end; align-items: center; gap: 4px; }

.icon-btn {
  width: 40px; height: 40px; border: 0; border-radius: 50%; background: transparent; color: var(--on-surface-variant);
  display: grid; place-items: center; cursor: pointer; position: relative; overflow: hidden;
  transition: border-radius .25s var(--ease-spring), background .2s, color .2s;
}
.icon-btn::after { content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0; transition: opacity .15s; }
.icon-btn:hover::after { opacity: .08; }
.icon-btn:active::after { opacity: .12; }
.icon-btn.toggled, .icon-btn[popovertarget][aria-expanded="true"] { border-radius: 12px; background: var(--secondary-container); color: var(--on-secondary-container); }
#btnTheme { anchor-name: --theme-trigger; }
#themeIcon path {
  opacity: 0; transform-box: view-box; transform-origin: center;
  transition: transform .42s var(--ease-spring), opacity .24s ease-in-out;
}
#themeIcon .theme-sun { transform: translateY(3px) rotate(-65deg) scale(.55); }
#themeIcon .theme-moon { transform: translateY(-3px) rotate(45deg) scale(.55); }
html[data-theme="light"] #themeIcon .theme-sun, html[data-theme="dark"] #themeIcon .theme-moon { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  #themeIcon path { transition: none; }
}

.switch { display: flex; align-items: center; gap: 10px; margin-right: 8px; white-space: nowrap; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--on-surface-variant); }
.switch input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.switch input:focus-visible + .track { outline: 2px solid var(--primary); outline-offset: 3px; }
.switch .track { width: 52px; height: 32px; border-radius: 16px; border: 2px solid var(--outline); background: var(--surface-highest); position: relative; transition: all .25s var(--ease); }
.switch .thumb { position: absolute; top: 50%; left: 6px; width: 16px; height: 16px; margin-top: -8px; border-radius: 50%; background: var(--outline); transition: all .25s var(--ease-spring); }
.switch input:checked + .track { background: var(--primary); border-color: var(--primary); }
.switch input:checked + .track .thumb { left: 24px; width: 24px; height: 24px; margin-top: -12px; background: var(--on-primary); }

/* ---------- Stage ---------- */
.stage {
  flex: 1; min-height: 0; position: relative; margin: 0 var(--table-right, 16px) var(--table-bottom, 16px) var(--table-left, 16px); border-radius: 28px; overflow: hidden;
  background: var(--stage);
}
.stage::before { /* fine felt texture */
  content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background-image: radial-gradient(var(--dot-a) 1px, transparent 0), radial-gradient(var(--dot-b) 1px, transparent 0);
  background-size: 8px 8px; background-position: 0 0, 4px 4px;
}
.stage::after {
  content: ''; position: absolute; inset: 0; z-index: 1; border-radius: inherit;
  pointer-events: none;
}
.stage::after, #setupModal { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .48); }
.stage.paused .board, .stage.paused ~ #cardLayer { filter: saturate(.5) brightness(.75); }
.stage.paused .board { pointer-events: none; }

/* Ambient light, Gemini-web style: every source sits OUTSIDE the screen edge and only its inner halo bleeds in.
   The band spans the whole edge behind whoever is playing; a narrower stream from the same off-screen source drifts toward the centre. */
.ambient { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.glow, .stream { position: absolute; opacity: 0; transition: opacity 1.3s ease; mix-blend-mode: var(--glow-blend); }
.glow.on, .stream.on { opacity: 1; }
/* PART 1 - edge band: fills the whole edge, strongest at the edge, hard-capped in height by a mask so it never climbs */
.glow.bottom { left: 0; right: 0; bottom: 0; height: 30%; -webkit-mask-image: linear-gradient(to top, #000 0, #000 20%, transparent 100%); mask-image: linear-gradient(to top, #000 0, #000 20%, transparent 100%); }
.glow.top    { left: 0; right: 0; top: 0;    height: 30%; -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 20%, transparent 100%); mask-image: linear-gradient(to bottom, #000 0, #000 20%, transparent 100%); }
.glow.left   { top: 0; bottom: 0; left: 0;   width: 24%;  -webkit-mask-image: linear-gradient(to right, #000 0, #000 20%, transparent 100%); mask-image: linear-gradient(to right, #000 0, #000 20%, transparent 100%); }
.glow.right  { top: 0; bottom: 0; right: 0;  width: 24%;  -webkit-mask-image: linear-gradient(to left, #000 0, #000 20%, transparent 100%); mask-image: linear-gradient(to left, #000 0, #000 20%, transparent 100%); }
/* PART 2 - centre light: ONE element projected from off-screen toward the table centre, restless */
/* each box starts well OUTSIDE the screen (its source sits on the box's outer edge), so the source / tail is never visible */
.stream.s-bottom { left: 50%; bottom: -30%; width: 32%; height: 80%; margin-left: -16%; }
.stream.s-top    { left: 50%; top: -30%;    width: 32%; height: 80%; margin-left: -16%; }
.stream.s-left   { top: 50%; left: -28%;    width: 80%; height: 40%; margin-top: -20%; }
.stream.s-right  { top: 50%; right: -28%;   width: 80%; height: 40%; margin-top: -20%; }
.gl { position: absolute; filter: blur(22px); will-change: transform, opacity;
  animation: glslide var(--d) ease-in-out var(--dl) infinite alternate, glbreath var(--b) ease-in-out var(--dl) infinite; }
.glow.bottom .gl, .glow.top .gl { inset: 0 -18%; }
.glow.left .gl, .glow.right .gl { inset: -18% 0; }
/* the centre light is an ordinary soft diffuse glow */
.stream .gl { inset: 0; filter: blur(30px); animation: glbreath var(--b) ease-in-out var(--dl) infinite; }
@keyframes glslide { from { transform: translate(0, 0) scale(1); } to { transform: translate(var(--tx), var(--ty)) scale(var(--sc, 1.07)); } }
@keyframes glbreath { 0%, 100% { opacity: .72; } 50% { opacity: 1; } }

/* ---------- Board ---------- */
.board {
  position: relative; height: 100%; padding: 12px 20px;
  display: grid; grid-template-columns: 1fr auto 1fr; grid-template-rows: auto 1fr auto;
}
.seat { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.seat-top { grid-column: 2; grid-row: 1; justify-content: flex-start; }
.seat-bottom { grid-column: 2; grid-row: 3; justify-content: flex-end; }
.seat-left { grid-column: 1; grid-row: 1 / 4; align-self: center; }
.seat-right { grid-column: 3; grid-row: 1 / 4; align-self: center; }
.seat { --cols: 2; --seat-cols: var(--cols); --seat-rows: 2; --gw: calc(var(--seat-cols) * var(--cw) + (var(--seat-cols) - 1) * var(--gap)); }

.name-pill {
  display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 14px; border-radius: 15px;
  background: var(--surface-high); color: var(--on-surface-variant); font-size: 13px; font-weight: 600;
  transition: background .3s, color .3s; white-space: nowrap;
}
.seat.active .name-pill { background: var(--primary); color: var(--on-primary); }
.name-pill .tag { display: none; padding: 1px 8px; border-radius: 10px; background: var(--error-container); color: var(--on-error-container); font-size: 11px; font-weight: 700; letter-spacing: .4px; }
.seat.caller .name-pill .tag { display: inline-block; }

.grid { display: grid; grid-template-rows: repeat(var(--seat-rows), var(--ch)); grid-template-columns: repeat(var(--seat-cols), var(--cw)); gap: var(--gap); }
.slot { grid-row: var(--slot-row); grid-column: var(--slot-col); width: var(--cw); height: var(--ch); border-radius: var(--rc); transition: background .2s; }
.slot.empty, .held.awaiting-draw { border: 2px dashed var(--outline-variant); border-radius: var(--rc); }
.held { position: absolute; width: var(--cw); height: var(--ch); pointer-events: none; }
.seat-top .held { left: calc(50% + var(--gw) / 2 + 18px); top: 40px; }
/* left and right seats: the cards sit at exactly the same y; only the name tag moves (left = below, right = above) */
html[data-theme] .seat-left .name-pill, html[data-theme] .seat-right .name-pill { position: absolute; left: 50%; transform: translateX(-50%); }
html[data-theme] .seat-left .name-pill { top: calc(50% + var(--ch) + 5px + 8px); }
html[data-theme] .seat-right .name-pill { bottom: calc(50% + var(--ch) + 5px + 8px); }
/* staging spots: me / top = right of the grid, left = above its left column, right = below its right column */
.seat-left .held { left: calc(50% - var(--gw) / 2); top: calc(50% - 2 * var(--ch) - 15px); }
.seat-right .held { left: calc(50% + var(--gw) / 2 - var(--cw)); top: calc(50% + var(--ch) + 15px); }
.dealer-tag { display: none; padding: 1px 8px; border-radius: 10px; background: var(--surface-highest); color: var(--on-surface); font-size: 11px; font-weight: 700; }
.seat.dealer .dealer-tag { display: inline-block; }
.seg { position: relative; display: flex; padding: 5px; margin-top: 10px; border-radius: 999px; background: color-mix(in srgb, var(--on-surface) 14%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--on-surface) 28%, transparent); }
html[data-theme="light"] .seg { background: #e4e9f2; box-shadow: inset 0 0 0 1px #aab4c8; }
html[data-theme="light"] .seg button { color: #2b3340; }
html[data-theme="light"] .seg button.on { color: #fff; }
.seg .ind { position: absolute; top: 5px; bottom: 5px; left: 5px; width: calc((100% - 10px) / var(--n, 3)); border-radius: 999px; background: var(--sel-bg); transition: transform .4s var(--ease-spring); }
.seg button { position: relative; z-index: 1; flex: 1; height: 42px; border: 0; border-radius: 999px; background: transparent; color: var(--on-surface); font-size: 16px; font-weight: 600; cursor: pointer; transition: color .2s; }
.seg button.on { color: var(--sel-fg); }
.dialog .btn.filled { background: var(--sel-bg); color: var(--sel-fg); }
.btn.ghost { background: transparent; color: var(--on-surface-variant); box-shadow: inset 0 0 0 1px var(--outline-variant); }
.btn.result-btn { position: absolute; right: var(--actions-right, 20px); bottom: 20px; z-index: 31; height: 44px; padding: 0 22px; font-size: 14px; }
/* selectable card back PATTERNS (Settings); the colour never changes. Default = "corners". */
html[data-back="plain"] .pc:where(:not([data-back])) .back::before, .pc[data-back="plain"] .back::before { display: none; }
html[data-back="frame"] .pc:where(:not([data-back])) .back::before, .pc[data-back="frame"] .back::before {
  --frame-inset: calc(var(--cw) * .06);
  inset: var(--frame-inset); border-radius: calc(var(--rc) - var(--frame-inset)); -webkit-mask: none; mask: none;
}
html[data-back="stripes"] .pc:where(:not([data-back])) .back::before, .pc[data-back="stripes"] .back::before { inset: 0; border: 0; border-radius: inherit; -webkit-mask: none; mask: none; opacity: .6;
  background: repeating-linear-gradient(135deg, transparent 0 7px, var(--back-line) 7px 8px); }
html[data-back="dots"] .pc:where(:not([data-back])) .back::before, .pc[data-back="dots"] .back::before { inset: 0; border: 0; border-radius: inherit; -webkit-mask: none; mask: none; opacity: .65;
  background: radial-gradient(var(--back-line) 1.1px, transparent 1.6px) 0 0 / calc(var(--cw) * .15) calc(var(--cw) * .15); }
.dialog.narrow { max-width: 340px; padding: 22px; }

.center { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 0 40px 10px; }
.piles { display: flex; gap: var(--pile-gap); }
.pile { width: var(--cw); height: var(--ch); border-radius: var(--rc); transition: outline-color .2s; outline: 2px solid transparent; outline-offset: 4px; }
.deck::after { content: ""; position: absolute; left: 6%; right: -4%; bottom: -7px; height: 10px; border-radius: 50%; background: rgba(0,0,0,.35); filter: blur(6px); }
html[data-theme="light"] .deck::after { background: rgba(31,31,31,.22); }
.deck { position: relative; }
.pile-meta { display: flex; gap: var(--pile-gap); margin-top: 3px; min-height: 16px; font-size: 12px; line-height: 16px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--on-surface-variant); }
.pile-meta span { width: var(--cw); text-align: right; }
.slap-bar { width: calc(var(--cw) * 2 + var(--pile-gap)); height: 10px; border-radius: 5px; background: color-mix(in srgb, var(--on-surface) 14%, transparent); overflow: hidden; opacity: 0; transition: opacity .2s; }
.slap-bar.on { opacity: 1; }
.slap-bar i { display: block; height: 100%; width: 100%; border-radius: 5px; background: linear-gradient(90deg, var(--bar-a), var(--bar-b) 50%, var(--bar-c)); background-size: calc(var(--cw) * 2 + var(--pile-gap)) 100%; transform-origin: left; }
html[data-theme="light"] .slap-bar { background: rgba(30, 50, 90, .2); box-shadow: inset 0 0 0 1px rgba(30, 50, 90, .22); }

  content: ''; position: absolute; inset-inline-end: 13px; top: 50%; width: 5px; height: 9px;
  border: solid var(--primary); border-width: 0 2px 2px 0; transform: translateY(-60%) rotate(45deg);
}
#themeMenu { position-anchor: --theme-trigger; }
#settingsModal {
  overflow: clip;
}
#settingsModal .dialog {
  --settings-surface: var(--surface-high);
  --settings-inset: clamp(14px, 4vw, 24px);
  --settings-divider: color-mix(in srgb, var(--on-surface) 14%, transparent);
  display: flex; flex-direction: column; max-width: 540px; overflow: hidden; padding: 20px 0 16px;
}
html[data-theme="light"] #settingsModal .dialog { --settings-surface: #fff; }
#settingsModal .dialog > h2, #settingsModal .actions { flex: none; padding-inline: var(--settings-inset); }
#settingsModal .actions {
  align-items: center; gap: 12px; margin-top: 0; padding-top: 14px;
  border-top: 1px solid var(--settings-divider);
}
#settingsModal .settings-note { flex: 1; min-width: 0; color: var(--on-surface-variant); font-size: 12px; line-height: 1.35; }
.settings-scroll {
  min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  scrollbar-width: thin; scrollbar-color: var(--outline) transparent;
  margin-inline: 6px; padding-inline: calc(var(--settings-inset) - 6px);
}
.settings-section + .settings-section { margin-top: 16px; }
.settings-section:last-child { margin-bottom: 10px; }
.settings-heading { margin-bottom: 6px; padding-inline: 4px; font-size: 15px; font-weight: 700; }
.settings-group {
  padding: 4px clamp(8px, 2.8vw, 16px); border-radius: 18px;
  background: color-mix(in srgb, var(--settings-surface) 94%, var(--on-surface)); border: 1px solid var(--settings-divider);
}
.rule-row {
  display: flex; justify-content: space-between; align-items: center; gap: 16px;
  padding: 11px 0; color: var(--on-surface); font-size: 14px; font-weight: 600;
}
.rule-row + .rule-row, #setRules .settings-choice + .rule-row { border-top: 1px solid var(--settings-divider); }
.rule-row small { display: block; margin-top: 2px; font-size: 12px; font-weight: 400; color: var(--on-surface-variant); }
.rule-row .switch { position: relative; margin: 0; flex: none; }
.username-input {
  min-width: 0; width: min(46%, 180px); padding: 9px 10px; border: 1px solid var(--outline-variant);
  border-radius: 10px; background: var(--surface); color: var(--on-surface); font: inherit; user-select: text;
}
.username-input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.seat-bottom .nm { max-inline-size: min(20ch, 42vw); overflow: hidden; text-overflow: ellipsis; }
#overTitle, #overBody td:nth-child(2) { overflow-wrap: anywhere; }
#setList, #setRules { container-type: inline-size; }
.settings-choice { padding: 8px 0; font-size: 14px; font-weight: 600; }
#setList .settings-choice + .settings-choice { border-top: 1px solid var(--settings-divider); }
.seg.settings-options.language-options {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
  gap: 6px; block-size: auto; min-height: 44px; padding: 5px;
}
.language-options .ind { display: none; }
.language-options button {
  height: 36px; border-radius: 999px;
  background: color-mix(in srgb, var(--on-surface) 6%, transparent);
  font-size: clamp(11px, 3.6cqw, 13px); font-weight: 600; color: var(--on-surface);
  transition: background .2s, color .2s, box-shadow .2s;
}
.language-options button.on {
  background: var(--sel-bg); color: var(--sel-fg);
  box-shadow: 0 1px 4px rgba(0,0,0,.2);
}
.language-options button:is(:hover, :focus-visible):not(.on) {
  background: color-mix(in srgb, var(--primary) 14%, transparent);
}
.seg.settings-language-picker { display: none; }
.seg.settings-options {
  --option-gap: 6px; --option-inset: 4px;
  width: 100%; block-size: 44px; gap: var(--option-gap); margin: 6px 0 0; padding: var(--option-inset);
}
.settings-options .ind {
  top: var(--option-inset); bottom: var(--option-inset); left: var(--option-inset);
  width: calc((100% - 2 * var(--option-inset) - (var(--n) - 1) * var(--option-gap)) / var(--n));
}
@media (prefers-reduced-motion: reduce) {
  .language-options .ind { transition: none; }
}
.settings-options button {
  display: grid; place-items: center; flex: 1 1 0; min-width: 0; height: 100%;
  padding: 3px 2px; text-align: center; font-size: clamp(10px, 4.7cqw, 13px); line-height: 1.2;
  overflow-wrap: break-word; text-wrap: balance;
  transition: color .2s, background .18s, box-shadow .18s;
}
#resetSettings { flex: none; }
.settings-options button:is(:hover, :focus-visible), #languageMenu button:is(:hover, :focus-visible) {
  background: color-mix(in srgb, var(--primary) 12%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--primary) 65%, transparent);
}
.settings-preview {
  --preview-height: calc(var(--ch) * 1.45);
  --preview-width: calc(var(--preview-height) * 5 / 7);
  position: absolute; left: calc(75% + 135px); top: 50%; translate: -50% -50%;
  width: var(--preview-width); height: var(--preview-height); pointer-events: none; perspective: 740px;
}
.settings-preview .pc {
  --ch: var(--preview-height); --cw: var(--preview-width); --rc: calc(var(--cw) * .11);
  visibility: hidden; pointer-events: none; transition: none; transform-style: preserve-3d;
}
.settings-preview .pc.active { visibility: visible; }
.settings-preview .pc.active:not(.departing) { z-index: 1; }
.settings-preview .pc-inner { transition: none; }
.settings-preview .joker .idx { font-size: calc(var(--cw) * .13); }
.settings-preview .joker .pip { font-size: calc(var(--cw) * .55); }
.settings-preview .joker .pip span { display: grid; place-items: center; line-height: 1; }
.settings-preview .joker .pip small { font-size: .23em; font-weight: 700; letter-spacing: .1em; }
@media (max-width: 780px), (any-hover: none) {
  .settings-preview { display: none; }
}
@container (max-width: 285px) {
  .seg.settings-options { --option-gap: 2px; --option-inset: 3px; }
  .settings-options button { padding-inline: 1px; }
}
.dialog table { width: 100%; border-collapse: collapse; font-size: 14px; margin: 8px 0 4px; }
#overModal table { border-collapse: separate; border-spacing: 0 5px; }
.dialog th { text-align: left; font-weight: 500; font-size: 12px; color: var(--on-surface-variant); padding: 6px 8px; }
.dialog td { padding: 10px 8px; border-top: 1px solid var(--outline-variant); color: var(--on-surface); }
.dialog tr.win td { border-top-color: transparent; background: var(--primary-container); color: var(--on-primary-container); }
html[data-theme="dark"] #overModal tr.win td { background: #364459; color: #e1e9f4; }
.dialog tr.win td:first-child { border-radius: 14px 0 0 14px; } .dialog tr.win td:last-child { border-radius: 0 14px 14px 0; }
.dialog .dup { opacity: .4; text-decoration: line-through; }
.dialog .red { color: #d93025; }
.dialog .pen { color: #d93025; font-size: 12px; margin-left: 6px; }
.dialog .score-tag { font-size: 12px; margin-inline-start: 6px; opacity: .8; }
.dialog .card-points { font-size: 10px; margin-inline-start: 2px; vertical-align: super; }
.dialog .score-card { display: inline-block; margin-inline-end: 8px; }

/* single shadow for piles: stacked cards carry no shadow of their own */
.pc.nosh .back { box-shadow: inset 0 0 0 1px var(--card-back-edge); }
.pc.nosh .front { box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }

/* who-knows badges */
.who { position: absolute; top: 12%; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; pointer-events: none; }
.who b { max-width: 88%; padding: 1px 7px; border-radius: 999px; background: var(--c); color: var(--wt); font-size: calc(var(--cw) * .15); font-weight: 600; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: none; }

/* skill magnifier + toast */
.lens { --lens: calc(var(--cw) * .62); position: absolute; left: 0; top: 0; width: var(--lens); height: var(--lens); border-radius: 50%; z-index: 9000; pointer-events: none; opacity: 0; display: grid; place-items: center; background: var(--soft-bg); color: var(--soft-fg); box-shadow: 0 0 0 2px color-mix(in srgb, var(--soft-fg) 40%, transparent), 0 2px 8px rgba(0,0,0,.3); transition: transform .6s var(--ease), opacity .3s; }
.lens svg { width: 62%; height: 62%; fill: currentColor; }
.toast {
  position: absolute; left: 0; top: 0; transform: translateY(-6px); z-index: 35;
  display: flex; align-items: center; gap: 12px; width: max-content; max-width: min(310px, calc(100% - 24px));
  padding: 8px 20px 8px 10px; border-radius: 26px; background: var(--tc, var(--surface-highest));
  color: #2b2f3a; opacity: 0; pointer-events: none; overflow-wrap: anywhere;
  transition: opacity .25s, transform .4s var(--ease-spring);
}
.toast.show:not(.unplaced) { opacity: 1; transform: none; }
.stage:not(.ingame) .toast { visibility: hidden; }
.toast .ti { flex: none; width: 38px; height: 38px; border-radius: 14px; background: rgba(255,255,255,.55); display: grid; place-items: center; }
.toast b { display: block; font-size: 14px; }
.toast-text { font-size: 12px; line-height: 1.3; }
.toast-text > span { display: block; margin-top: 1px; color: rgba(43,47,58,.75); }
.toast.compact { gap: 8px; padding: 6px 10px 6px 8px; border-radius: 16px; transform: none; }
.toast.compact .ti { width: 26px; height: 26px; border-radius: 9px; }
.toast.compact .icon { width: 18px; height: 18px; }
.toast.compact b { font-size: 12px; }
.toast.compact .skill-detail { display: none; }
.toast.brief { padding-block: 4px; }
.toast.brief .ti { width: 22px; height: 22px; }
.toast.brief .toast-text > span { display: none; }


/* light mode legibility */
/* each player has a colour: pastel name tag normally, pure saturated colour while it is their turn */
.seat[data-seat="0"] { --pc: var(--pc0); --pa: var(--pa0); }
.seat[data-seat="1"] { --pc: var(--pc1); --pa: var(--pa1); }
.seat[data-seat="2"] { --pc: var(--pc2); --pa: var(--pa2); }
.seat[data-seat="3"] { --pc: var(--pc3); --pa: var(--pa3); }
.name-pill, html[data-theme="light"] .name-pill { position: relative; background: var(--pc); color: var(--pill-fg); box-shadow: none; transition: background .35s, color .35s; }
.name-pill::after { content: ""; position: absolute; inset: 3px; border-radius: inherit; border: 1px solid var(--pill-line); pointer-events: none; transition: border-color .35s; }
.seat.active .name-pill, html[data-theme="light"] .seat.active .name-pill { background: var(--pa); color: #2b2f3a; box-shadow: none; }
.seat.active .name-pill::after { border-color: var(--pill-line-act); }
.name-pill .dealer-tag { background: color-mix(in srgb, currentColor 14%, transparent); color: inherit; position: relative; z-index: 1; }
.name-pill .tag { position: relative; z-index: 1; }
html[data-theme="light"] .status { background: #fff; color: #1f2937; box-shadow: inset 0 0 0 1px rgba(0,0,0,.2), 0 2px 8px rgba(0,0,0,.14); }
html[data-theme="light"] .status.me { background: #394a69; color: #fff; box-shadow: 0 3px 12px rgba(40,55,90,.35); }
html[data-theme="light"] .round-info { color: #1f2937; opacity: 1; }
html[data-theme="light"] .log { background: rgba(255,255,255,.9); }
html[data-theme="light"] .front { box-shadow: inset 0 0 0 1px rgba(0,0,0,.22), 0 2px 4px rgba(0,0,0,.28); }
html[data-theme="light"] .back { box-shadow: inset 0 0 0 1px rgba(0,0,0,.18), 0 2px 4px rgba(0,0,0,.28); }
html[data-theme="light"] .pc.nosh .front { box-shadow: inset 0 0 0 1px rgba(0,0,0,.22); }
html[data-theme="light"] .pc.nosh .back { box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
html[data-theme="light"] :is(.slot.empty, .held.awaiting-draw) { border-color: #8d9ab0; }
.tt { position: fixed; z-index: 200; max-width: 260px; padding: 6px 12px; border-radius: 8px; background: var(--tt-bg); color: var(--tt-fg); font-size: 12px; font-weight: 500; line-height: 1.4; pointer-events: none; opacity: 0; transform: translateY(-4px) scale(.96); transition: opacity .15s, transform .22s var(--ease-spring); }
.tt.show { opacity: 1; transform: none; }
#settingsModal, #rulesModal { z-index: 95; }
@media (max-width: 700px), (max-height: 500px) and (max-width: 950px), (max-height: 500px) and (pointer: coarse) {
  :root {
    --header-height: 48px;
    --table-left: max(6px, env(safe-area-inset-left, 0px));
    --table-right: max(6px, env(safe-area-inset-right, 0px));
    --table-bottom: max(6px, env(safe-area-inset-bottom, 0px));
  }
  .topbar { padding-inline: var(--table-left) var(--table-right); }
  .topbar .brand { display: none; }
  .tools { flex: 1; min-width: 0; justify-content: center; gap: 2px; }
  .tools .icon-btn { flex: 0 1 44px; width: auto; min-width: 0; height: 44px; }
  .tools .icon { width: 20px; height: 20px; }
  @media (min-width: 600px) {
    .topbar .brand { display: block; font-size: 20px; }
    .tools { justify-content: flex-end; margin-inline-start: 12px; }
  }

  .hudbox {
    top: 6px; left: 10px; right: 10px; max-width: none;
    display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 7px; align-items: center;
    pointer-events: none;
  }
  .round-info { padding-left: 0; font-size: 11px; white-space: nowrap; }
  .status { justify-self: start; min-height: 28px; padding: 5px 9px; font-size: 12px; line-height: 1.25; border-radius: 14px; overflow-wrap: anywhere; }
  .shortcut-hint { grid-column: 1 / -1; padding: 0; font-size: 11px; line-height: 1.25; }
  .shortcut-hint > div:not([hidden]) { display: inline; }
  .shortcut-hint > div:not([hidden]) + div:not([hidden]) { margin: 0 0 0 8px; }
  .shortcut-hint kbd { padding-inline: 4px; }

  .corner, .btn.result-btn { bottom: 6px; right: var(--actions-right, 8px); }
  .corner { gap: 4px; max-width: calc(100% - 96px); }
  .corner .btn, .btn.result-btn { height: 38px; padding-inline: 13px; font-size: 13px; }
  .corner .btn { white-space: normal; line-height: 1.15; }
  .log {
    --log-open-width: min(46%, 248px); --log-closed-width: min(96px, 46%);
    --log-open-height: min(144px, 68%); --log-head-height: 36px;
    left: 8px; bottom: 6px;
  }
  .log-head { padding-inline: 10px 6px; gap: 6px; font-size: 12px; }
  .log-head .icon { flex: none; width: 16px; height: 16px; }
  .log-body { padding: 0 9px 8px; overscroll-behavior: contain; overflow-wrap: anywhere; }
  .stage.ingame:not(.restored) .log { animation: none; }
  .toast.compact.brief { padding-block: 2px; }
  .toast.brief .ti { width: 20px; height: 20px; }
  .toast.narrow { max-width: min(122px, calc(34% - 10px)); gap: 6px; }
  .toast.narrow .toast-text { min-width: 0; }

  .scrim { padding: 8px; border-radius: 18px; }
  .dialog, .dialog.narrow { padding: 14px; border-radius: 18px; }
  .dialog h2 { font-size: clamp(19px, 4.8vw, 22px); margin-bottom: 8px; }
  .dialog .body { font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
  .dialog .actions { margin-top: 10px; }
  .dialog .actions .btn { height: 38px; padding-inline: 14px; font-size: 13px; }
  .dialog.narrow .seg button { height: 36px; }
  #rulesModal .dialog { display: flex; flex-direction: column; overflow: hidden; }
  #rulesModal .dialog h2, #rulesModal .actions { flex: none; }
  #rulesModal .dialog .body { min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  #settingsModal .dialog { --settings-inset: 12px; padding: 12px 0 8px; }
  #settingsModal .actions { gap: 8px; margin-top: 0; padding-top: 8px; }
  .seg.settings-options.language-options { display: none; }
  .seg.settings-language-picker { display: block; margin-top: 6px; padding: 0; }
  .settings-language-picker select {
    display: block; appearance: none; width: 100%; min-height: 44px; padding: 8px 36px 8px 14px;
    border: 0; border-radius: inherit; background: transparent; color: inherit; color-scheme: dark;
    font-size: 16px; font-weight: 600; cursor: pointer; touch-action: manipulation;
  }
  html[data-theme="light"] .settings-language-picker select { color-scheme: light; }
  .settings-language-picker select:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .settings-language-picker::after {
    content: ''; position: absolute; inset-inline-end: 17px; top: 50%; width: 7px; height: 7px;
    border: solid currentColor; border-width: 0 2px 2px 0; transform: translateY(-70%) rotate(45deg); pointer-events: none;
  }
  #overModal table { font-size: 12px; }
  #overModal :is(th, td) { padding: 6px 4px; overflow-wrap: anywhere; }
  #overModal .score-card { margin-inline-end: 3px; }
  #overModal .score-tag, #overModal .pen { margin-inline-start: 4px; font-size: 10px; }
}
@media (any-hover: none) { .tt { display: none; } }
</style>

function withEnglishFallback(base, translation) {
  if (translation == null) return base;
  if (base === undefined) return translation;
  if (Array.isArray(base)) {
    return Array.isArray(translation) ? base.map((value, i) => withEnglishFallback(value, translation[i])) : base;
  }
  if (typeof base !== 'object' || base === null) return typeof translation === typeof base ? translation : base;
  if (typeof translation !== 'object' || Array.isArray(translation)) return base;
  const keys = new Set([...Object.keys(base), ...Object.keys(translation)]);
  const entries = [...keys].map(key => [key, withEnglishFallback(base[key], translation[key])]);
  return Object.fromEntries(entries.filter(([, value]) => value !== undefined));
}

const LANGUAGE_CODES = Object.keys(LOCALES);
const T = Object.fromEntries(LANGUAGE_CODES.map(code => [code, withEnglishFallback(LOCALES[DEFAULT_LANGUAGE], LOCALES[code])]));
const LANGUAGE_LABELS = Object.fromEntries(LANGUAGE_CODES.map(code => [code, T[code].label]));

function selectLanguage(...preferences) {
  for (const preference of preferences) {
    if (typeof preference !== 'string' || !preference) continue;
    if (Object.hasOwn(LOCALES, preference)) return preference;
    let tag;
    try { tag = Intl.getCanonicalLocales(preference)[0].toLowerCase(); } catch { continue; }
    const exact = LANGUAGE_CODES.find(code => T[code].tag.toLowerCase() === tag);
    if (exact) return exact;
    if (tag.includes('hant') || tag === 'zh-tw' || tag === 'zh-hk' || tag === 'zh-mo') {
      if (LANGUAGE_CODES.includes('zh-TW')) return 'zh-TW';
    }
    const base = tag.split('-')[0];
    const related = LANGUAGE_CODES.find(code => T[code].tag.toLowerCase().split('-')[0] === base);
    if (related) return related;
  }
  return DEFAULT_LANGUAGE;
}

  bindSettingsPreview(display, preview) {

      cards.back.select(pref === 'back' ? v : null);

      group.onpointerleave = () => { if (group.contains(hovered)) { hovered = null; sync(); } };
      group.onfocusout = (event) => { if (!group.contains(event.relatedTarget) && group.contains(focused)) { focused = null; sync(); } };
      for (const button of group.querySelectorAll('button')) {

        button.onfocus = () => { if (button.matches(':focus-visible')) { focused = button; sync(); } };

  makeSettingsPreviewCard(preview, major, reducedMotion) {
    const joker = T[this.lang].ui.joker;
    const sample = this.makeCardEl({ id: major ? 'settings-highlight' : 'settings-pattern', rank: joker.rank, suit: '', red: major });
    sample.classList.add('joker');
    sample.querySelector('.pip').innerHTML = `<span>${major ? '♛' : '♚'}<small>${major ? joker.major : joker.minor}</small></span>`;
    preview.appendChild(sample);
    const inner = sample.querySelector('.pc-inner');
    const front = sample.querySelector('.front');
    const direction = major ? -1 : 1;
    let target = null, flight, turn, frame = null, nextDiagonal = 7;
    const clearFlight = () => {
      sample.classList.remove('active', 'departing');
      flight?.cancel();
      flight = null;
    };
    const travel = (show) => {
      sample.classList.toggle('departing', !show);
      if (reducedMotion.matches) {
        clearFlight();
        sample.classList.toggle('active', show);
        return;
      }
      if (show && !flight) {
        sample.classList.add('active');
        flight = sample.animate([
          { transform: `translate(45vw, ${direction * 25}vh) rotateY(${direction * 720}deg) rotateZ(${direction * 32}deg)` },
          { transform: `translate(29vw, ${direction * 30}vh) rotateY(${direction * 490}deg) rotateZ(${direction * -24}deg)`, offset: .34 },
          { transform: `translate(10vw, ${direction * 9}vh) rotateY(${direction * 220}deg) rotateZ(${direction * 12}deg)`, offset: .72 },
          { transform: 'translate(0, 0) rotateY(0deg) rotateZ(0deg)' },
        ], { duration: 730, easing: 'cubic-bezier(.28,.64,.32,1)', fill: 'both' });
        flight.onfinish = () => { if (flight?.playbackRate < 0) clearFlight(); };
      } else if (flight && !show && !(flight.currentTime > 0)) {
        clearFlight();
      } else if (flight && flight.playbackRate !== (show ? 1 : -1)) {
        flight.reverse();
      }
    };
    const clearTurn = () => {
      if (frame !== null) cancelAnimationFrame(frame);
      frame = null;
      turn?.cancel();
      turn = null;
      front.style.removeProperty('transform');
    };
    const flipBack = () => {
      if (!target) return;
      if (reducedMotion.matches) { clearTurn(); sample.dataset.back = target; return; }
      if (turn) {
        const progress = turn.effect.getComputedTiming().progress ?? 0;
        if (progress >= .25 && progress < .75) sample.dataset.back = target;
        return;
      }
      if (sample.dataset.back === target) return;
      const next = target;
      // A 3:7 axis meets the short edges 20% in from opposite corners of a 5:7 card.
      const axis = `3, ${nextDiagonal}, 0`;
      nextDiagonal = -nextDiagonal;
      front.style.transform = `rotate3d(${axis}, 180deg)`;
      const animation = inner.animate([
        { transform: `rotate3d(${axis}, 0deg)` },
        { transform: `rotate3d(${axis}, 360deg)` },
      ], { duration: 680, easing: 'ease-in-out', fill: 'both' });
      turn = animation;
      const swapWhenHidden = () => {
        if (turn !== animation) return;
        if ((animation.effect.getComputedTiming().progress ?? 0) < .5) {
          frame = requestAnimationFrame(swapWhenHidden);
          return;
        }
        sample.dataset.back = target || next;
        frame = null;
      };
      frame = requestAnimationFrame(swapWhenHidden);
      animation.onfinish = () => {
        if (turn !== animation) return;
        if (frame !== null) sample.dataset.back = target || next;
        clearTurn();
        flipBack();
      };
    };
    return {
      select: (option) => {
        if (option === target) return;
        const previous = target;
        target = option;
        if (!target) { travel(false); return; }
        sample.dataset.hl = major ? target : 'none';
        if (major) sample.dataset.back = this.back;
        else if (!previous && !sample.classList.contains('active') && !turn) sample.dataset.back = target;
        else flipBack();

      },
      reset: () => { target = null; clearTurn(); clearFlight(); },
    };
  }

  positionSkillToast() {
    const { toast, stage, deck, discard, log, roundActions, status } = this.el;

    const bounds = elements => elements.filter(Boolean).map(el => el.getBoundingClientRect()).filter(r => r.width && r.height);

      ...this.seatEls.map(seat => seat.querySelector('.grid')),

      if (x < area.left + 8 || right > area.right - 8 || y < area.top || bottom > area.bottom - 8) return null;

      const fromRight = [...obstacles].sort((a, b) => b.right - a.right);

        let x = area.right - padding - width;

        if (!resumed) this.swapSel = null;
        this.setHud(this.swapSel ? 'swap2' : 'swap1');
        const r = await this.ask('swap');          // one of mine + one of theirs, either order
        if (r === 'SKIP') return;
        mine = r.mine; theirs = r.theirs;
        this.selected = null; this.swapSel = null;
      } else {
        const known = own().filter(k => p.known.has(p.slots[k].id)).sort((a, b) => this.cardPoints(p.slots[b]) - this.cardPoints(p.slots[a]));
        if (known.length && this.cardPoints(p.slots[known[0]]) <= 4) return;       // nothing worth giving away
        mine = known.length ? known[0] : own()[Math.floor(Math.random() * own().length)];
        const all = opp(), good = all.filter(t => {
          const c = this.players[t.p].slots[t.i];
          return p.known.has(c.id) && this.cardPoints(c) <= 3;
        });
        const hum = all.filter(t => t.p === 0);
        theirs = good.length ? good[0] : (hum.length && Math.random() < .7 ? hum[Math.floor(Math.random() * hum.length)] : all[Math.floor(Math.random() * all.length)]);
        const a = p.slots[mine], b = this.players[theirs.p].slots[theirs.i];
        a.el.classList.add('lift'); b.el.classList.add('lift'); await this.sleep(900);
        a.el.classList.remove('lift'); b.el.classList.remove('lift');
      }
      const q = this.players[theirs.p], a = p.slots[mine], b = q.slots[theirs.i];
      const fromA = a.loc, fromB = b.loc;
      p.slots[mine] = b; q.slots[theirs.i] = a;
      a.loc = { t: 'slot', p: theirs.p, i: theirs.i }; b.loc = { t: 'slot', p: i, i: mine };
      this.recordMove(a, fromA); this.recordMove(b, fromB);
      a.z = ++this.seq; b.z = ++this.seq;
      // knowledge follows the card: everyone watched it move, so whoever knew a card still knows it in its new seat
      sound.swap(); this.layout();
      this.log('swap', { p: i, i: mine + 1, q: theirs.p, j: theirs.i + 1 }, 'skill');
      this.checkpoint('slap');
      await this.sleep(MOVE + 150);
    }
  }

  /* ---------- AI ---------- */
  aiWorst(p) {
    let bi = -1, bs = -1;
    p.slots.forEach((s, k) => { if (!s) return; const sc = p.known.has(s.id) ? this.cardPoints(s) : 6.5; if (sc > bs) { bs = sc; bi = k; } });
    return { bi, bs };
  }
  aiTakes(p, top) { const { bi, bs } = this.aiWorst(p); return bi >= 0 && bs - this.cardPoints(top) >= 3 && Math.random() < .85; }
  aiChoose(p, c, force) {
    const { bi, bs } = this.aiWorst(p);
    if (force && bi >= 0) return { type: 'replace', i: bi };
    const gain = bs - this.cardPoints(c);
    if (bi >= 0) {
      if ((c.skill && this.ar.skills) ? gain >= 5 : gain >= 1) return { type: 'replace', i: bi };
    }
    return { type: 'discard' };
  }
  aiWantsMonkey(p) {
    if (p.turns < 3) return false;
    const cards = p.slots.filter(Boolean), known = cards.filter(c => p.known.has(c.id));
    const unknown = cards.length - known.length;
    if (!unknown && this.ar.kamikaze && this.isKamikazeHand(known)) return true;
    const est = this.scoreHand(known).base + unknown * 6.5;
    return unknown <= 1 && est <= 6 + p.aggro * 6.5;
  }
  checkEmptyHand(i) {
    const player = this.players[i];
    if (player.held || player.slots.some(Boolean)) return false;
    if (this.caller === null) this.declareMonkey(i, true);
    return true;
  }
  declareMonkey(i, automatic = false) {
    this.caller = i; this.finalLeft = 3;
    // An off-turn call gives the current actor a full final turn after their current one.
    this.finalTriggerTurn = automatic && this.turn >= 0 && this.turn !== i ? this.turn : null;
    this.seatEls[i].classList.add('caller');
    sound.monkey(); this.log(automatic ? 'monkeyAuto' : 'monkey', { p: i }, 'monkey');
    this.refresh();
  }
  async callMonkey(i) {
    this.declareMonkey(i);
    this.checkpoint('turnDone');
    await this.sleep(900);
  }

  /* ---------- slap window ---------- */
  canSlapOpponent(actor) {
    return this.ar.opponentSlap && this.players[actor].slots.some(c => c && !c.up);
  }
  humanSlapOpen() {
    const S = this.slap;
    return !!(S && S.phase === 'human' && !S.humanLocked && !S.skipped && !S.closed && S.t < S.humanMs);
  }
  async slapWindow(resume = {}) {
    const top = this.discard[this.discard.length - 1]; if (!top) return;
    const canSlapOpponent = this.canSlapOpponent(0);
    const cand = this.players.some((p, i) => (i === 0 || canSlapOpponent) && p.slots.some(c => c && !c.up && this.humanKnown.has(c.id) && c.rank === top.rank));
    const humanMs = (!this.assist || cand) ? 6000 : 3600;
    const S = this.slap = { humanLocked: false, skipped: false, chainActor: null, closed: false, compensation: null,
      t: 0, phase: 'human', plan: null, humanMs, aiUntil: null, ...resume.slap };
    // Older saves completed the window after any success or a single AI attempt.
    if (S.success || S.plan?.done || (resume.failure && resume.failure.actor !== 0)) S.closed = true;
    if (S.phase === 'ai' && S.aiUntil === null) S.aiUntil = Math.max(S.t, S.plan?.at ?? 0) + 50;
    S.busy = !!(resume.failure || S.compensation);
    const updateProgress = () => { this.el.slapFill.style.transform = `scaleX(${Math.max(0, 1 - S.t / S.humanMs) ** 2})`; };
    this.setHud('slap', { opponent: canSlapOpponent });
    this.el.slapBar.classList.toggle('on', S.phase === 'human');
    updateProgress();
    this.refresh();
    try {
      if (resume.failure) this.finishFailedSlap(resume.failure.actor, this.byId[resume.failure.target]).catch(e => { if (e !== CANCEL) console.error(e); });
      else if (S.compensation) this.finishSlapCompensation().catch(e => { if (e !== CANCEL) console.error(e); });
      else this.checkpoint('slap', { slap: S });
      while (true) {
        await this.sleep(50);
        if (this.prompt?.mode !== 'slapCompensate') S.t += 50;
        if (S.phase === 'human') {
          updateProgress();
          if (S.busy) continue;
          if (S.closed) break;
          if (this.humanSlapOpen()) continue;
          if (S.chainActor !== null) break;
          S.phase = 'ai'; S.humanLocked = true; this.el.slapBar.classList.remove('on'); this.refresh();
          S.aiUntil = S.t + 1600;
          S.plan = this.planAISlap(this.discard.at(-1), S.t);
          this.checkpoint('slap', { slap: S });
        }
        if (S.phase === 'ai' && !S.busy) {
          if (S.closed || S.t > S.aiUntil) break;
          if (!S.plan && S.chainActor !== null) {
            S.plan = this.planAISlap(this.discard.at(-1), S.t, S.chainActor);
            if (S.plan) this.checkpoint('slap', { slap: S });
          }
          const plan = S.plan;
          if (!plan || plan.at > S.aiUntil) break;
          if (S.t >= plan.at) {
            S.plan = null;
            this.doSlap(plan.p, plan.i, plan.owner ?? plan.p).catch(e => { if (e !== CANCEL) console.error(e); });
          }
        }
      }
    } finally {
      if (this.slap === S) {
        this.slap = null; this.el.slapBar.classList.remove('on'); this.refresh();
      }
    }
    if (this.turn === 0 && this.phase === 'play') this.setHud('aiTurn', { p: this.turn });
  }
  planAISlap(top, t, actor = null) {
    let best = null;
    for (const pi of actor === null ? [1, 2, 3] : [actor]) {
      const p = this.players[pi];
      const canSlapOpponent = this.canSlapOpponent(pi);
      const candidates = this.players.flatMap((other, owner) => (owner === pi || canSlapOpponent)
        ? other.slots.flatMap((c, i) => c && !c.up ? [{ owner, i, c }] : []) : []);
      const matches = candidates.filter(({ c }) => p.known.has(c.id) && c.rank === top.rank);
      if (!matches.length || (actor === null && Math.random() > p.aggro + .3)) continue;
      let choice = matches.find(({ owner }) => owner === pi) ?? matches[0];
      if (Math.random() < p.err) choice = candidates[Math.floor(Math.random() * candidates.length)];
      const at = t + (actor === null ? 500 + Math.random() * 1100 : 140 + Math.random() * 180);
      if (!best || at < best.at) best = { p: pi, owner: choice.owner, i: choice.i, at };
    }
    return best;
  }
  async humanSlap(i, owner = 0) {
    if (this.paused || !this.humanSlapOpen() || this.slap.busy) return;
    await this.doSlap(0, i, owner);
  }
  async doSlap(pi, i, owner = pi) {
    const S = this.slap;
    if (!S || S.busy || (S.chainActor !== null && S.chainActor !== pi)) return;
    if (owner !== pi && !this.canSlapOpponent(pi)) return;
    const c = this.players[owner].slots[i], top = this.discard.at(-1);
    if (!c || c.up || !top) return;
    S.busy = true;
    if (c.rank !== top.rank) {
      if (pi === 0) S.humanLocked = true;
      if (pi !== 0 || S.chainActor !== null) S.closed = true;
      sound.fail(); this.log('slapFail', { p: pi, q: owner, c: this.card(c), penalty: this.ar.slapPenalty }, 'slap');
      return await this.finishFailedSlap(pi, c);
    }
    S.chainActor = pi;
    if (owner !== pi) S.compensation = { actor: pi, owner, slot: i };
    c.up = true; this.place(c, { t: 'discard' }); this.lastDiscardBy = pi;
    sound.ok(); this.log(owner === pi ? 'slapOk' : 'slapOpponent', { p: pi, q: owner, i: i + 1, c: this.card(c) }, 'slap');
    if (owner === pi && this.checkEmptyHand(pi)) S.closed = true;
    this.checkpoint('slap', { slap: S });
    await this.sleep(MOVE);
    if (S.compensation) await this.finishSlapCompensation();
    else this.completeSlap(S);
  }
  async finishSlapCompensation() {
    const S = this.slap;
    const { actor, owner, slot } = S.compensation;
    const p = this.players[actor], faceDown = p.slots.map(c => c?.up ? null : c);
    if (actor === 0) this.setHud('slapCompensate', { p: owner });
    const i = actor === 0 ? await this.ask('slapCompensate') : this.aiWorst({ ...p, slots: faceDown }).bi;
    const c = p.slots[i];
    c.up = false;
    S.compensation = null;
    this.place(c, { t: 'slot', p: owner, i: slot });
    this.log('slapCompensation', { p: actor, q: owner }, 'slap');
    if (this.checkEmptyHand(actor)) S.closed = true;
    this.setHud('slap', { opponent: this.canSlapOpponent(0) });
    this.checkpoint('slap', { slap: S });
    await this.sleep(MOVE);
    this.completeSlap(S);
  }
  completeSlap(S) {
    S.busy = false;
    this.checkpoint('slap', { slap: S });
    this.refresh();
  }
  async finishFailedSlap(pi, c) {
    c.up = true; this.layout();
    this.checkpoint('slap', { slap: this.slap, failure: { actor: pi, target: c.id } });
    await this.sleep(1000);
    c.up = false; this.layout();
    await this.sleep(300);
    if (this.ar.slapPenalty) await this.penalty(pi);
    this.completeSlap(this.slap);
  }
  async penalty(pi) {
    const p = this.players[pi];
    const card = this.drawCard(); if (!card) return;
    let k = p.slots.findIndex(s => !s);
    if (k < 0) { if (p.slots.length >= 6) return; k = p.slots.length; }
    this.ensureSlot(pi, k);
    card.up = false; this.place(card, { t: 'slot', p: pi, i: k });
    this.checkpoint('slap', { slap: this.slap });
    sound.deal(); await this.sleep(MOVE);
  }

  /* ---------- scoring and results ---------- */
  cardPoints(c) {
    return this.ar.redKingZero && c.rank === 'K' && c.red ? 0 : c.value;
  }
  scoreHand(cards) {
    const seen = new Set();
    let base = 0;
    const parts = cards.map(c => {
      const points = this.cardPoints(c), dup = this.ar.pairOnce && seen.has(points);
      if (!dup) base += points;
      seen.add(points);
      return { c, points, dup };
    });
    return { base, parts };
  }
  isKamikazeHand(cards) {
    return cards.length === 4 && cards.filter(c => c.rank === 'Q').length === 2 && cards.filter(c => c.rank === 'K').length === 2;
  }
  scoreRound() {
    const hands = this.players.map(p => p.slots.filter(Boolean));
    const kamikaze = this.ar.kamikaze ? hands.flatMap((cards, i) => this.isKamikazeHand(cards) ? [i] : []) : [];
    if (kamikaze.length) {
      const rows = hands.map((cards, i) => {
        const special = kamikaze.includes(i), score = special ? 0 : 50;
        return { i, base: score, final: score, pen: 0, zeroed: false, kamikaze: special,
          parts: cards.map(c => ({ c, points: null, dup: false })) };
      });
      return { rows, kamikaze, callerSucceeded: null };
    }
    const rows = hands.map((cards, i) => {
      const { base, parts } = this.scoreHand(cards);
      return { i, base, final: base, parts, pen: 0, zeroed: false, kamikaze: false };
    });
    let callerSucceeded = null;
    if (this.caller !== null) {
      const cr = rows[this.caller];
      callerSucceeded = !rows.some(r => r.i !== this.caller && (this.ar.strictTie ? r.base <= cr.base : r.base < cr.base));
      if (callerSucceeded && this.ar.callerZeroScore) {
        cr.zeroed = true;
        cr.final = 0;
      } else if (!callerSucceeded && this.ar.penalty) {
        cr.pen = 10;
        cr.final += cr.pen;
      }
    }
    return { rows, kamikaze, callerSucceeded };
  }
  async finish() {
    this.checkpoint('finish');
    this.phase = 'over'; this.turn = -1;
    this.setHud('over'); this.setGlow('all'); this.refresh();
    for (let i = 0; i < 4; i++) {
      this.players[i].slots.forEach(c => { if (c) c.up = true; });
      sound.flip(); this.layout(); await this.sleep(380);
    }
    const { rows, kamikaze, callerSucceeded } = this.scoreRound();
    if (kamikaze.length) this.log('kamikaze', { players: kamikaze }, 'monkey');
    else if (this.caller !== null) {
      const caller = rows[this.caller];
      if (caller.pen) this.log('penalty', { p: this.caller, strictTie: this.ar.strictTie }, 'monkey');
      if (caller.zeroed) this.log('monkeyZero', { p: this.caller }, 'monkey');
    }
    rows.sort((a, b) => a.final - b.final);
    rows.forEach(r => { this.match.totals[r.i] += r.final; });
    this.overData = rows;
    const M = this.match;
    M.history[M.round - 1].result = {
      caller: this.caller,
      scoring: kamikaze.length ? 'kamikaze' : 'normal',
      callerSucceeded,
      winners: rows.filter(r => r.final === rows[0].final).map(r => r.i),
      players: rows.map(({ i, base, final, pen, zeroed, kamikaze, parts }) => ({
        player: i, hand: this.players[i].slots.map(c => c?.id ?? null), base, penalty: pen, score: final, total: M.totals[i],
        zeroed, kamikaze, cardScores: parts.map(({ c, points, dup }) => ({ card: c.id, points, duplicate: dup })),
      })),
    };
    if (M.round >= M.rounds) M.completedAt = new Date().toISOString();
    this.checkpoint('results');
    const playerWon = M.round >= M.rounds
      ? M.totals[0] === Math.min(...M.totals)
      : rows.some(r => r.i === 0 && r.final === rows[0].final);
    if (playerWon) sound.ok();
    await this.sleep(900);
    this.renderOver();
    this.el.over.classList.add('open');
  }
  setExportMenu(open) {
    this.setDropdownOpen(document.getElementById('btnExport'), document.getElementById('exportMenu'), open);
  }
  exportMatch(format) {
    const M = this.match;
    if (!M?.completedAt) return;
    const bestTotal = Math.min(...M.totals);
    const contents = format === 'txt'
      ? this.logs.map(entry => {
        const text = this.logText(entry);
        return entry.type === 'round-separator' ? `\n── ${text} ──` : text;
      }).join('\n').trimStart() + '\n'
      : JSON.stringify({
        version: 1, startedAt: M.startedAt, completedAt: M.completedAt, rules: this.ar,
        players: this.roster.map(({ human }, id) => ({ id, human, name: { en: this.nm(id, 'en') }, total: M.totals[id] })),
        winners: M.totals.flatMap((total, id) => total === bestTotal ? [id] : []),
        rounds: M.history, log: this.logs.map(({ key, a, type, round }) => ({ key, a, type, round })),
      }, null, 2) + '\n';
    const mime = format === 'txt' ? 'text/plain' : 'application/json';
    const url = URL.createObjectURL(new Blob([contents], { type: mime + ';charset=utf-8' }));
    const link = document.createElement('a');
    link.href = url;
    link.download = `monkey-${M.completedAt.slice(0, 19).replaceAll(':', '-')}.${format}`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  renderOver() {
    const M = this.match, fin = M.round >= M.rounds, U = T[this.lang].ui, O = T[this.lang].over;
    const score = r => fin ? M.totals[r.i] : r.final;
    const rows = this.overData.slice().sort((a, b) => score(a) - score(b));
    const winners = rows.filter(r => score(r) === score(rows[0]));
    const w = winners[0].i;
    let title;
    if (winners.length > 1) {
      const names = new Intl.ListFormat(T[this.lang].tag).format(winners.map(r => this.nm(r.i)));
      title = fin ? O.finalTie(names) : O.tie(names);
    } else {
      const defaultPlayerName = w === 0 && !this.username;
      title = fin ? (defaultPlayerName ? O.finalYou() : O.finalOther(this.nm(w))) : (defaultPlayerName ? O.you() : O.other(this.nm(w)));
    }
    document.getElementById('overTitle').textContent = title;
    const roundSummary = rows.some(r => r.kamikaze) ? ` ${O.kamikazeSummary}` : '';
    document.getElementById('overSub').textContent = `${U.roundLbl(M.round, M.rounds)} - ${fin ? U.finalSub : U.overSub}${roundSummary}`;
    document.getElementById('btnAgain').textContent = fin ? U.again : U.nextRound;
    this.setExportMenu(false);
    document.getElementById('exportActions').hidden = !fin || !M.completedAt;
    const body = document.getElementById('overBody'); body.innerHTML = '';
    let rank = 0;
    rows.forEach((r, k) => {
      if (k === 0 || score(r) !== score(rows[k - 1])) rank = k + 1;
      const tr = document.createElement('tr'); if (rank === 1) tr.className = 'win';
      const chips = r.parts.map(({ c, dup, points }) => {
        const zero = !dup && points === 0 ? '<span class="card-points">0</span>' : '';
        return `<span class="score-card ${dup ? 'dup' : (c.red ? 'red' : '')}">${c.suit}${c.rank}${zero}</span>`;
      }).join('') || '-';
      const tag = (this.caller === r.i ? `<span class="score-tag">${r.zeroed ? O.monkeyZero : O.monkeyTag}</span>` : '')
        + (r.pen ? `<span class="pen">${O.pen}</span>` : '')
        + (r.kamikaze ? `<span class="score-tag">${O.kamikazeTag}</span>` : '');
      tr.innerHTML = `<td>${rank}</td><td>${tag}</td><td>${chips}</td><td>${r.final}</td><td><b>${M.totals[r.i]}</b></td>`;
      tr.cells[1].prepend(document.createTextNode(this.nm(r.i)));
      body.appendChild(tr);
    });
  }
}

window.addEventListener('DOMContentLoaded', () => { window.game = new Game(); });
if (window.isSecureContext && ['http:', 'https:'].includes(location.protocol) && 'serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope: './', updateViaCache: 'none' }).catch((error) => {
      console.warn('Combio could not enable offline play:', error);
    });
  });
}
</script>
